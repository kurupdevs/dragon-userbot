services:
  - type: web
    name: dragon-userbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python __main__.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PREFIX
        sync: false
        value: "."
